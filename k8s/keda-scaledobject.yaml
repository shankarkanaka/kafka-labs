apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: kafka-consumer-scaler
  namespace: kafka
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: kafka-consumer
  minReplicaCount: 1         # always keep at least 1 consumer running
  maxReplicaCount: 10        # scale up to 10 consumers max
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: my-cluster-kafka-bootstrap.kafka.svc:9092
        consumerGroup: my-consumer-group
        topic: my-topic
        lagThreshold: "5"    # scale up when consumer lag exceeds 5 messages
        offsetResetPolicy: earliest
