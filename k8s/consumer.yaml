apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-consumer
  namespace: kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-consumer
  template:
    metadata:
      labels:
        app: kafka-consumer
    spec:
      containers:
        - name: kafka-consumer
          image: localhost/kafka-consumer:latest
          imagePullPolicy: Never          # use locally built image in Kind
          env:
            - name: BOOTSTRAP_SERVERS
              value: my-cluster-kafka-bootstrap.kafka.svc:9092
            - name: TOPIC
              value: my-topic
            - name: GROUP_ID
              value: my-consumer-group
            - name: AUTO_OFFSET_RESET
              value: earliest
            - name: PROCESSING_DELAY_SEC
              value: "5"                 # simulate slow processing to build lag
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
